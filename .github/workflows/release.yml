name: Release

# Publishes a GitHub release with the APK and the web version whenever the version in
# package.json hasn't been released yet: bump the version, add its section to
# RELEASE_NOTES.md, and push to hue-control. This creates the hue-remote-v<version>
# tag. Pushing a hue-remote-v* tag yourself works too.
on:
  push:
    branches: [hue-control]
    tags: ["hue-remote-v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            VERSION="${GITHUB_REF_NAME#hue-remote-v}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          APK_VERSION="$(sed -n 's/.*android:versionName="\([^"]*\)".*/\1/p' android/AndroidManifest.xml)"
          if [ "$APK_VERSION" != "$VERSION" ]; then
            echo "::error::Version mismatch: release $VERSION, but android/AndroidManifest.xml says $APK_VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=hue-remote-v$VERSION" >> "$GITHUB_ENV"
          if gh release view "hue-remote-v$VERSION" >/dev/null 2>&1; then
            echo "hue-remote-v$VERSION is already released; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.version.outputs.skip != 'true'
        with:
          node-version: 22

      - name: Test the web server
        if: steps.version.outputs.skip != 'true'
        run: npm test

      - name: Install Android build tools
        if: steps.version.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            android-sdk-platform-23 aapt dalvik-exchange zipalign apksigner zip

      - name: Build the APK
        if: steps.version.outputs.skip != 'true'
        env:
          KEYSTORE_B64: ${{ secrets.HUE_REMOTE_KEYSTORE }}
          RELEASE_KEYSTORE_PASS: ${{ secrets.HUE_REMOTE_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export KEYSTORE="$RUNNER_TEMP/release.keystore" KEY_ALIAS=hue-remote KEYSTORE_PASS="$RELEASE_KEYSTORE_PASS"
          else
            echo "::warning::No HUE_REMOTE_KEYSTORE secret, so this APK is signed with a throwaway key and the next release can't install over it."
            export KEYSTORE="$RUNNER_TEMP/throwaway.keystore"
          fi
          android/build.sh

      - name: Package
        if: steps.version.outputs.skip != 'true'
        run: |
          mkdir -p dist "stage/hue-remote-web-$VERSION"
          cp android/build/hue-remote.apk "dist/hue-remote-$VERSION.apk"
          cp -r package.json README.md RELEASE_NOTES.md server web dev "stage/hue-remote-web-$VERSION/"
          (cd stage && zip -qr "../dist/hue-remote-web-$VERSION.zip" "hue-remote-web-$VERSION")
          (cd dist && sha256sum -- * > SHA256SUMS.txt)

      - name: Release notes
        if: steps.version.outputs.skip != 'true'
        run: |
          awk -v v="$VERSION" '/^## /{ p = ($2 == v); next } p' RELEASE_NOTES.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::RELEASE_NOTES.md has no '## $VERSION' section"
            exit 1
          fi
          { echo; echo "### SHA-256"; echo; echo '```'; cat dist/SHA256SUMS.txt; echo '```'; } >> notes.md

      - name: Publish the release
        if: steps.version.outputs.skip != 'true'
        run: |
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" \
            --title "Hue Remote $VERSION" --notes-file notes.md
